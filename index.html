      function safeGetLocalStorage(key, defaultValue, validator) {
        try {
          const cached = localStorage.getItem(key);
          if (!cached || cached === 'undefined' || cached === 'null') return defaultValue;
          const parsed = JSON.parse(cached);
          if (parsed === null || parsed === undefined) return defaultValue;
          if (validator) return validator(parsed);
          return parsed;
        } catch (e) {
          console.error("Error reading storage for " + key + ":", e);
          return defaultValue;
        }

                                          type="text" placeholder="السعر (مثال: 30,000 IQD)"
                                          value={pr.price}
                                          onChange={(e) => {
                                            const next = [...serverForm.prices];
                                            next[i].price = e.target.value;
                                            setServerForm({ ...serverForm, prices: next });
                                          }}
                                          className="bg-slate-950 border border-slate-800 rounded p-1.5 flex-1 text-xs"
                                        />
                                        <label className="text-2xs flex items-center gap-1 cursor-pointer">
                                          <input 
                                            type="checkbox"
                                            checked={pr.isPopular}
                                            onChange={(e) => {
                                              const next = [...serverForm.prices];
                                              next[i].isPopular = e.target.checked;
                                              setServerForm({ ...serverForm, prices: next });
                                            }}
                                            className="rounded border-slate-805"
                                          />
                                          <span>شائع؟</span>
                                        </label>
                                        <button 
                                          type="button" 
                                          onClick={() => {
                                            const next = serverForm.prices.filter((_, idx) => idx !== i);
                                            setServerForm({ ...serverForm, prices: next });
                                          }}
                                          className="text-red-500 text-xs"
                                        >
                                          ✕
                                        </button>
                                      </div>
                                    ))}
                                  </div>

                                  <div className="flex gap-2 justify-end pt-4">
                                    <button 
                                      type="button" onClick={() => setEditingServerId(null)}
                                      className="px-4 py-2 bg-slate-950 hover:bg-slate-800 text-slate-400 rounded-xl text-xs cursor-pointer"
                                    >
                                      إلغاء
                                    </button>
                                    <button 
                                      type="submit"
                                      className="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs cursor-pointer"
                                    >
                                      تأكيد وحفظ السيرفر
                                    </button>
                                  </div>
                                </form>
                              </div>
                            )}

                          </div>
                        )}


                        {activeAdminTab === 'products' && (
                          <div className="space-y-6">
                            
                            {editingProdId === null ? (
                              <div className="space-y-4">
                                <div className="flex items-center justify-between">
                                  <h3 className="text-md font-bold text-white">قائمة الاشتراكات الترفيهية النشطة</h3>
                                  <button 
                                    onClick={handleStartAddProduct}
                                    className="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold cursor-pointer"
                                  >
                                    + إضافة منتج/اشتراك آخر
                                  </button>
                                </div>

                                <div className="space-y-2.5">
                                  {products.map((p) => (
                                    <div key={p.id} className="p-4 bg-slate-950 border border-slate-850 rounded-2xl flex items-center justify-between gap-4 font-sans">
                                      <div className="flex items-center gap-3">
                                        <div className="p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-blue-400"><Icon name={p.icon || "Sparkles"} className="w-5 h-5" /></div>
                                        <div>
                                          <h4 className="text-sm font-bold text-white">{p.name}</h4>
                                          <p className="text-[10px] text-slate-500 line-clamp-1">{p.description}</p>
                                        </div>
                                      </div>

                                      <div className="flex items-center gap-2">
                                        <button 
                                          onClick={() => handleStartEditProduct(p)}
                                          className="p-2 bg-slate-900 border border-slate-805 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg text-xs cursor-pointer"
                                        >
                                          تعديل
                                        </button>
                                        <button 
                                          onClick={() => handleDeleteProduct(p.id)}
                                          className="p-2 bg-red-950/20 border border-red-500/20 text-red-500 rounded-lg text-xs cursor-pointer"
                                        >
                                          حذف
                                        </button>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            ) : (
                              <div>
                                <div className="flex items-center justify-between border-b border-white/5 pb-3 mb-4">
                                  <h3 className="text-md font-bold text-white">
                                    {editingProdId === 'new' ? 'إضافة وتأسيس منتج ترفيهي جديد' : 'تعديل ميزات واشتراك ' + prodForm.name}
                                  </h3>
                                  <button onClick={() => setEditingProdId(null)} className="text-slate-400 hover:text-white text-xs">إلغاء التعديل</button>
                                </div>

                                <form onSubmit={handleSaveProduct} className="space-y-4 font-sans">
                                  <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-400">اسم الاشتراك/الحساب</label>
                                    <input 
                                      type="text" required
                                      value={prodForm.name}
                                      onChange={(e) => setProdForm({ ...prodForm, name: e.target.value })}
                                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                                    />
                                  </div>

                                  <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-400">اسم الأيقونة الرسمية المفضلة (من مكتبة Lucide)</label>
                                    <input 
                                      type="text" placeholder="مثال: Clapperboard, Monitor, Youtube, Gamepad2"
                                      value={prodForm.icon}
                                      onChange={(e) => setProdForm({ ...prodForm, icon: e.target.value })}
                                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-left text-white"
                                    />
                                  </div>

                                  <div className="space-y-1">
                                    <label className="text-xs font-bold text-slate-400">الوصف التعريفي للاشتراك</label>
                                    <textarea 
                                      rows="3"
                                      value={prodForm.description}
                                      onChange={(e) => setProdForm({ ...prodForm, description: e.target.value })}
                                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                                    />
                                  </div>

                                  {/* Prices items edit */}
                                  <div className="space-y-2 bg-slate-950/45 p-4 rounded-xl border border-slate-850">
                                    <h4 className="text-xs font-bold text-white flex items-center justify-between">
                                      <span>باقات وأسعار هذا الاشتراك</span>
                                      <button 
                                        type="button" 
                                        onClick={() => setProdForm({ ...prodForm, prices: [...prodForm.prices, { duration: '', price: '', isPopular: false }] })}
                                        className="text-[10px] text-blue-450 font-bold"
                                      >
                                        + إضافة باقة
                                      </button>
                                    </h4>

                                    {prodForm.prices.map((pr, i) => (
                                      <div key={i} className="flex gap-2 items-center">
                                        <input 
                                          type="text" placeholder="المدة (مثال: شهر واحد)"
                                          value={pr.duration}
                                          onChange={(e) => {
                                            const next = [...prodForm.prices];
                                            next[i].duration = e.target.value;
                                            setProdForm({ ...prodForm, prices: next });
                                          }}
                                          className="bg-slate-950 border border-slate-800 rounded p-1.5 flex-1 text-xs text-white"
                                        />
                                        <input 
                                          type="text" placeholder="السعر (مثال: 4,000 IQD)"
                                          value={pr.price}
                                          onChange={(e) => {
                                            const next = [...prodForm.prices];
                                            next[i].price = e.target.value;
                                            setProdForm({ ...prodForm, prices: next });
                                          }}
                                          className="bg-slate-950 border border-slate-800 rounded p-1.5 flex-1 text-xs text-white"
                                        />
                                        <label className="text-2xs flex items-center gap-1">
                                          <input 
                                            type="checkbox"
                                            checked={pr.isPopular}
                                            onChange={(e) => {
                                              const next = [...prodForm.prices];
                                              next[i].isPopular = e.target.checked;
                                              setProdForm({ ...prodForm, prices: next });
                                            }}
                                          />
                                          <span>شائع؟</span>
                                        </label>
                                        <button 
                                          type="button" 
                                          onClick={() => {
                                            const next = prodForm.prices.filter((_, idx) => idx !== i);
                                            setProdForm({ ...prodForm, prices: next });
                                          }}
                                          className="text-red-500 text-xs"
                                        >
                                          ✕
                                        </button>
                                      </div>
                                    ))}
                                  </div>

                                  <div className="flex gap-2 justify-end pt-4">
                                    <button 
                                      type="button" onClick={() => setEditingProdId(null)}
                                      className="px-4 py-2 bg-slate-950 hover:bg-slate-800 text-slate-400 rounded-xl text-xs cursor-pointer"
                                    >
                                      إلغاء
                                    </button>
                                    <button 
                                      type="submit"
                                      className="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-xs cursor-pointer"
                                    >
                                      تأكيد وحفظ
                                    </button>
                                  </div>
                                </form>
                              </div>
                            )}

                          </div>
                        )}

                      </div>

                    </div>
                  )}

                </div>
              </div>
            )}

          </div>
        );
      }

      // Render execution
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
</body>
</html>

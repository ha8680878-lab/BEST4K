<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --gold:#d4af37;
    --gold2:#f1d592;

    --bg:#050505;
    --card:#101010;

    --text:#ffffff;
    --muted:#b8b8b8;

    --border:rgba(255,255,255,.07);

    --shadow:
        0 0 25px rgba(212,175,55,.20);

    --shadow2:
        0 0 60px rgba(212,175,55,.12);
}

body{

    font-family:'Cairo',sans-serif;

    background:#050505;

    color:white;

    overflow-x:hidden;
}

html{
    scroll-behavior:smooth;
}

a{
    text-decoration:none;
}

/* ===== BACKGROUND ===== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

        radial-gradient(circle at top right,
            rgba(212,175,55,.12),
            transparent 20%),

        radial-gradient(circle at bottom left,
            rgba(212,175,55,.08),
            transparent 25%),

        linear-gradient(
            to bottom,
            #050505,
            #070707,
            #050505
        );

    z-index:-3;
}

/* ===== TOPBAR ===== */

.topbar{

    position:fixed;

    top:0;
    right:0;

    width:100%;

    z-index:9999;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(16px);

    border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{

    max-width:1450px;

    margin:auto;

    padding:18px 35px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

/* ===== LOGO ===== */

.brand{

    display:flex;

    align-items:center;

    gap:18px;
}

.logo{

    width:68px;
    height:68px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #0f0f0f,
            #191919
        );

    border:2px solid rgba(212,175,55,.45);

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    overflow:hidden;

    box-shadow:
        var(--shadow),
        inset 0 0 25px rgba(212,175,55,.08);

    animation:logoGlow 3s infinite ease-in-out;
}

.logo::before{

    content:"";

    position:absolute;

    inset:-30%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(212,175,55,.25),
            transparent
        );

    animation:rotate 5s linear infinite;
}

.logo span{

    position:relative;

    z-index:2;

    font-size:1rem;

    font-weight:900;

    color:var(--gold2);
}

.iraq-flag{

    position:absolute;

    bottom:0;

    width:100%;

    height:13px;

    background:
        linear-gradient(
            to bottom,
            #ce1126 0%,
            #ce1126 33%,
            white 33%,
            white 66%,
            black 66%,
            black 100%
        );

    animation:flagMove 2s infinite ease-in-out;
}

@keyframes flagMove{

    0%,100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(2px);
    }
}

@keyframes rotate{

    100%{
        transform:rotate(360deg);
    }
}

@keyframes logoGlow{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }
}

.brand-text h1{

    font-size:1.15rem;

    font-weight:900;
}

.brand-text p{

    color:#999;

    font-size:.82rem;
}

/* ===== MENU ===== */

.menu{

    display:flex;

    gap:32px;
}

.menu a{

    color:#cfcfcf;

    font-size:.95rem;

    transition:.3s;
}

.menu a:hover{

    color:var(--gold2);
}

/* ===== HERO ===== */

.hero{

    position:relative;

    min-height:100vh;

    display:flex;

    align-items:center;

    overflow:hidden;
}

.hero::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            to left,
            rgba(0,0,0,.95),
            rgba(0,0,0,.55),
            rgba(0,0,0,.92)
        ),

        url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070&auto=format&fit=crop');

    background-size:cover;

    background-position:center;

    opacity:.48;
}

.hero-inner{

    max-width:1450px;

    margin:auto;

    width:100%;

    padding:140px 35px 80px;

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:1.1fr .9fr;

    gap:55px;

    align-items:center;
}

/* ===== LEFT ===== */

.hero-left h5{

    display:inline-flex;

    align-items:center;

    gap:12px;

    padding:12px 18px;

    border-radius:60px;

    background:rgba(212,175,55,.08);

    border:1px solid rgba(212,175,55,.25);

    color:var(--gold2);

    margin-bottom:28px;
}

    font-size:5.6rem;

    line-height:1.05;http://googleusercontent.com/generated_image_content/0

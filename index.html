<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEST 4K | الاشتراك الرسمي</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">

<style>
:root {
    --gold: #d4af37;
    --bg: #050505;
    --card: #111;
    --text: #fff;
    --muted: #aaa;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: system-ui;
    background: var(--bg);
    color: var(--text);
}

/* ===== HERO ===== */
.hero {
    position: relative;
    height: 80vh;
    overflow: hidden;
}

.slides {
    display: flex;
    height: 100%;
    transition: transform 1s ease;
}

.slide {
    min-width: 100%;
}

.slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(30%);
}

/* overlay */
.hero-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

/* LOGO */
.logo {
    width: 120px;
    height: 120px;
    border: 3px solid var(--gold);
    border-radius: 50%;
    margin: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-shadow: 0 0 20px rgba(212,175,55,0.4);
}

.logo span:first-child {
    color: var(--gold);
    font-weight: bold;
    font-size: 22px;
}

.logo span:last-child {
    font-size: 26px;
    border: 2px solid var(--gold);
    margin: 5px 20px 0;
}

h1 {
    margin-top: 15px;
    color: var(--gold);
}

.tag {
    color: var(--muted);
}

/* ===== SECTION ===== */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 15px;
}

.title {
    text-align: center;
    color: var(--gold);
    margin: 40px 0;
}

/* ===== CARDS ===== */
.grid {
    display: grid;
    gap: 20px;
}

.pricing {
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
}

.card {
    background: var(--card);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    transition: .3s;
    border: 1px solid #222;
}

.card:hover {
    transform: translateY(-6px);
    border-color: var(--gold);
}

.price {
    font-size: 28px;
    color: var(--gold);
}

/* ===== BUTTON ===== */
.btn {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 35px;
    background: #25d366;
    color: white;
    border-radius: 40px;
    text-decoration: none;
    font-weight: bold;
}

/* ===== FOOTER ===== */
footer {
    text-align: center;
    padding: 40px;
    color: #666;
    border-top: 1px solid #222;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
    h1 {font-size: 22px;}
    .logo {width:90px;height:90px;}
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
    <div class="slides" id="slider">
        <div class="slide"><img src="https://images.unsplash.com/photo-1593789198777-f29bc23293cc?q=80"></div>
        <div class="slide"><img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80"></div>
        <div class="slide"><img src="https://images.unsplash.com/photo-1520004434532-668416ca0a78?q=80"></div>
    </div>

    <div class="hero-content">
        <div class="logo">
            <span>BEST</span>
            <span>4K</span>
        </div>
        <h1>BEST 4K</h1>
        <p class="tag">تجربة مشاهدة احترافية داخل منزلك</p>
    </div>
</section>

<!-- PRICING -->
<div class="container">
    <h2 class="title">الباقات</h2>

    <div class="grid pricing">
        <div class="card">
            <h3>شهر</h3>
            <div class="price">7,000 IQD</div>
        </div>

        <div class="card">
            <h3>3 أشهر</h3>
            <div class="price">12,000 IQD</div>
        </div>

        <div class="card">
            <h3>6 أشهر</h3>
            <div class="price">20,000 IQD</div>
        </div>

        <div class="card">
            <h3>سنة</h3>
            <div class="price">30,000 IQD</div>
        </div>
    </div>

    <div style="text-align:center;">
        <a href="https://wa.me/9647740393776" class="btn">
            <i class="fab fa-whatsapp"></i> طلب تجربة مجانية
        </a>
    </div>
</div>

<footer>
    BEST 4K © 2026
</footer>

<script>
let i = 0;
const slider = document.getElementById("slider");
const total = slider.children.length;

setInterval(()=>{
    i = (i + 1) % total;
    slider.style.transform = `translateX(-${i * 100}%)`;
},4000);
</script>

</body>
</html>

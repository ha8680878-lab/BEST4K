                          <Icon name="Tv" className="w-4 h-4" />

                        <button
                          onClick={() => { setActiveAdminTab('products'); setEditingServerId(null); setEditingProdId(null); }}

                            activeAdminTab === 'products' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-800'

                          <Icon name="Download" className="w-4 h-4 text-white" />

                        </button>
                      </div>

                      <div className="lg:col-span-3 bg-slate-900/40 border border-slate-800 p-6 md:p-8 rounded-2xl h-auto">

                          <form onSubmit={handleSaveSettings} className="space-y-6 text-right">
                            <h3 className="text-base font-bold text-white border-b border-slate-800 pb-3 mb-4">تعديل معلومات وهوية المتجر</h3>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              <div>
                                <label className="block text-xs font-bold text-slate-400 mb-1.5">عنوان السطح الرئيسي للموقع:</label>

                                  value={settingsForm.title}

                                />
                              </div>
                              <div>
                                <label className="block text-xs font-bold text-slate-400 mb-1.5">أشرطة العناوين الفرعية والمميزات:</label>
                                <input 
                                  type="text" 
                                  value={settingsForm.subtitle}
                                  onChange={(e) => setSettingsForm({ ...settingsForm, subtitle: e.target.value })}
                                  className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white"
                                />
                              </div>
                            </div>

                            <div>
                              <label className="block text-xs font-bold text-slate-400 mb-1.5">الوصف التعريفي الممتد (الظاهر بالهيرو الرئيسي):</label>

                                  type="text" 
                                  placeholder="مثال: 9647700000000"

                                  onChange={(e) => setSettingsForm({ ...settingsForm, whatsappNumber: e.target.value })}

                                  onChange={(e) => setSettingsForm({ ...settingsForm, logoText: e.target.value })}

                                />
                              </div>
                            </div>

                            <div>
                              <label className="block text-xs font-bold text-slate-400 mb-1.5">قالب وبناء صيغة رسالة الحجز الواردة للواتساب تلقائياً:</label>
                              <textarea 
                                value={settingsForm.whatsappTemplate}
                                onChange={(e) => setSettingsForm({ ...settingsForm, whatsappTemplate: e.target.value })}
                                className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white"
                              />
                              <span className="text-[10px] text-slate-500 mt-1 block">يمكنك استخدام المتغيرات الفرعية: {"{product}"} لسيرفر الاشتراك، {"{plan}"} للباقة، و{"{price}"} للسعر الإجمالي</span>
                            </div>

                            <div className="flex gap-2 justify-end pt-4">
                              <button 
                                type="submit"
                                className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold cursor-pointer"
                              >
                                حفظ تعديلات الهوية وتطبيقها 📌
                              </button>
                            </div>
                          </form>
                        )}

                        {activeAdminTab === 'servers' && (
                          <div className="text-right">
                            {editingServerId === null ? (
                              <div className="space-y-4">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                                  <h3 className="text-base font-bold text-white">قائمة وإدارة سيرفرات IPTV الحالية</h3>
                                  <button 
                                    onClick={handleStartAddServer}
                                    className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-2xs font-extrabold text-white cursor-pointer"
                                  >
                                    + إضافة سيرفر IPTV جديد 📺
                                  </button>
                                </div>

                                <div className="space-y-2">
                                  {servers.map((srv) => (
                                    <div key={srv.id} className="p-4 bg-slate-950 border border-slate-850 rounded-xl flex items-center justify-between">
                                      <div className="flex items-center gap-3">
                                        <span className="w-8 h-8 rounded-lg bg-blue-600/20 text-blue-400 text-xs font-black flex items-center justify-center">{srv.logoText || srv.name[0]}</span>

                                          <h4 className="font-extrabold text-white text-sm">{srv.name}</h4>
                                          <p className="text-3xs text-slate-550 font-sans">{srv.tagline}</p>
                                        </div>
                                      </div>
                                      <div className="flex items-center gap-2">
                                        <button 
                                          onClick={() => handleStartEditServer(srv)}
                                          className="px-2.5 py-1.5 bg-slate-900 border border-slate-800 text-slate-350 hover:text-white rounded-lg text-3xs font-extrabold cursor-pointer"
                                        >
                                          تعديل وميزات ⚙
                                        </button>
                                        <button 
                                          onClick={() => handleDeleteServer(srv.id)}
                                          className="px-2.5 py-1.5 bg-red-650/10 border border-red-500/20 text-red-400 hover:bg-red-600 hover:text-white rounded-lg text-3xs font-extrabold cursor-pointer"
                                        >
                                          حذف نهائي 🗑

                                  <h3 className="text-lg font-bold text-white">
                                    {editingServerId === 'new' ? 'إضافة وتأسيس سيرفر IPTV جديد' : 'تعديل وإعداد سيرفر ' + serverForm.name}

                                  <button onClick={() => setEditingServerId(null)} className="text-slate-400 hover:text-white text-xs">إلغاء التعديل</button>

                                <form onSubmit={handleSaveServer} className="space-y-4">
                                  <div>
                                    <label className="block text-xs font-bold text-slate-400 mb-1">اسم السيرفر لتفعيل الاشتراك:</label>
                                    <input 
                                      type="text" required
                                      value={serverForm.name}
                                      onChange={(e) => setServerForm({ ...serverForm, name: e.target.value })}
                                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white"
                                    />
                                  </div>

                                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                      <label className="block text-xs font-bold text-slate-400 mb-1">الشعار والرمز النصي بالسيرفر:</label>
                                      <input 
                                        type="text" 
                                        value={serverForm.logoText}
                                        onChange={(e) => setServerForm({ ...serverForm, logoText: e.target.value })}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white"
                                      />
                                    </div>
                                    <div>
                                      <label className="block text-xs font-bold text-slate-400 mb-1">رابط صورة او لوجو خارجي (اختياري):</label>
                                      <input 
                                        type="text" 
                                        value={serverForm.logoUrl}
                                        onChange={(e) => setServerForm({ ...serverForm, logoUrl: e.target.value })}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white text-left font-mono"

                                    />

                                    <label className="block text-xs font-bold text-slate-400 mb-1">الشرح الطويل والتوضيح للجمهور:</label>

                                      value={serverForm.shortDesc}
                                      onChange={(e) => setServerForm({ ...serverForm, shortDesc: e.target.value })}

                                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white resize-none"
                                    />
                                  </div>

                                          value={pr.duration}
                                          onChange={(e) => {
                                            const n = [...serverForm.prices];
                                            n[idx].duration = e.target.value;

                                          type="text" required placeholder="السعر بالدينار العراقي"
                                          value={pr.price}
                                          onChange={(e) => {
                                            const n = [...serverForm.prices];
                                            n[idx].price = e.target.value;
                                            setServerForm({ ...serverForm, prices: n });

                                          onClick={() => {

                                          className="px-2.5 py-1.5 bg-slate-900 border border-slate-800 text-slate-350 hover:text-white rounded-lg text-3xs font-extrabold cursor-pointer"

                                          تعديل ونشاط ⚙

                                          حذف نهائي 🗑
                                        </button>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            ) : (
                              <div>
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                                  <h3 className="text-lg font-bold text-white">
                                    {editingProdId === 'new' ? 'إضافة وتأسيس منتج ترفيهي جديد' : 'تعديل ميزات واشتراك ' + prodForm.name}
                                  </h3>
                                  <button onClick={() => setEditingProdId(null)} className="text-slate-400 hover:text-white text-xs font-sans">إلغاء التعديل</button>
                                </div>

                                <form onSubmit={handleSaveProduct} className="space-y-4">
                                  <div>
                                    <label className="block text-xs font-bold text-slate-400 mb-1">اسم الاشتراك الترفيهي المتاح للجمهور:</label>
                                    <input 
                                      type="text" required
                                      value={prodForm.name}
                                      onChange={(e) => setProdForm({ ...prodForm, name: e.target.value })}
                                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white"
                                    />
                                  </div>

                                  <div>
                                    <label className="block text-xs font-bold text-slate-400 mb-1">الوصف الفرعي لتفاصيل الاشتراك والضمان المعطى:</label>
                                    <textarea 
                                      value={prodForm.description}
                                      onChange={(e) => setProdForm({ ...prodForm, description: e.target.value })}
                                      rows={2}
                                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white resize-none"
                                    />
                                  </div>

                                  <div className="border-t border-slate-800 pt-4">
                                    <h4 className="text-sm font-bold text-white mb-2">جدول الأسعار وباقات الشحن المتاحة للاختيار:</h4>
                                    {prodForm.prices.map((pr, idx) => (
                                      <div key={idx} className="flex gap-2 mb-2">
                                        <input 
                                          type="text" required placeholder="العنوان، مثال: شهر واحد"
                                          value={pr.duration}
                                          onChange={(e) => {
                                            const n = [...prodForm.prices];
                                            n[idx].duration = e.target.value;
                                            setProdForm({ ...prodForm, prices: n });
                                          }}
                                          className="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                                        />
                                        <input 
                                          type="text" required placeholder="السعر الإجمالي بـ IQD"
                                          value={pr.price}
                                          onChange={(e) => {
                                            const n = [...prodForm.prices];
                                            n[idx].price = e.target.value;
                                            setProdForm({ ...prodForm, prices: n });
                                          }}
                                          className="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-2 text-white"
                                        />
                                        <button 
                                          type="button"
                                          onClick={() => {
                                            const n = prodForm.prices.filter((_, i) => i !== idx);
                                            setProdForm({ ...prodForm, prices: n });
                                          }}
                                          className="px-2 bg-red-600/20 text-red-400 hover:bg-red-650 rounded-lg text-xs"
                                        >
                                          إلغاء الخيار
                                        </button>
                                      </div>
                                    ))}
                                    <button 
                                      type="button"
                                      onClick={() => {
                                        const n = [...prodForm.prices, { duration: '', price: '', isPopular: false }];
                                        setProdForm({ ...prodForm, prices: n });
                                      }}
                                      className="text-2xs text-blue-400 pl-2 cursor-pointer font-bold"
                                    >
                                      + إضافة خيار مدة/سعر ترفيهي آخر
                                    </button>
                                  </div>

                                  <div className="flex gap-2 justify-end pt-4 border-t border-slate-800">
                                    <button type="button" onClick={() => setEditingProdId(null)} className="px-4 py-2 bg-slate-950 border border-slate-800 text-slate-450 rounded-lg text-xs font-bold">إلغاء التعديل</button>
                                    <button type="submit" className="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-white text-xs font-bold">تم وحفظ البيانات 💾</button>
                                  </div>
                                </form>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

          </div>
        );
      }

      // Render App
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>

                  <button 
                    onClick={() => setSelectedServer(null)}
                    className="fixed top-6 left-6 w-12 h-12 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:bg-slate-800 transition-all cursor-pointer z-[2600]"
                  >
                    <Icon name="X" className="w-6 h-6" />
                  </button>

                  {/* Hero Box */}
                  <div className={"p-8 md:p-12 rounded-3xl bg-gradient-to-br " + activeColors.bg + " border " + activeColors.border + " relative overflow-hidden mb-8"}>
                    <div className="absolute top-0 right-0 w-96 h-96 bg-indigo-500/5 rounded-full blur-3xl -z-10" />
                    
                    <div className="flex flex-col md:flex-row items-center gap-6 text-center md:text-right">
                      {selectedServer.logoUrl ? (
                        <div className="w-24 h-24 rounded-2xl overflow-hidden shrink-0 bg-slate-900 border border-white/5 shadow-xl flex items-center justify-center">
                          <img src={selectedServer.logoUrl} alt={selectedServer.name} className="w-full h-full object-cover" referrerPolicy="no-referrer" />
                        </div>
                      ) : (
                        <div className={"w-24 h-24 rounded-2xl shrink-0 " + (selectedServer.logoBg || "bg-slate-800") + " flex items-center justify-center text-white text-3xl font-black shadow-xl"}>
                          {selectedServer.logoText || selectedServer.name[0]}
                        </div>
                      )}

                      <div className="flex-1 space-y-2">
                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-4">
                          <h2 className="text-3xl md:text-4xl font-extrabold text-white">{selectedServer.name}</h2>
                          <span className={"px-3 py-1 rounded-full text-xs font-bold border " + activeColors.badge}>
                            {selectedServer.badge || 'سيرفر'}
                          </span>
                        </div>
                        <p className={"text-lg font-bold " + activeColors.text}>{selectedServer.tagline}</p>
                        <p className="text-slate-300 text-sm md:text-base max-w-3xl leading-relaxed font-sans">{selectedServer.shortDesc}</p>
                      </div>
                    </div>
                  </div>

                  {/* Stats columns */}
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8 font-sans">
                    {selectedServer.stats && selectedServer.stats.map((st, idx) => (
                      <div 
                        key={idx} 
                        className={"bg-slate-900/60 p-5 rounded-2xl border " + activeColors.statBg + " text-center space-y-1"}
                      >
                        <div className={"text-xl md:text-2xl font-black " + activeColors.text}>{st.value}</div>
                        <div className="text-xs font-bold text-slate-400">{st.label}</div>
                      </div>
                    ))}
                  </div>

                  {/* Guide and Manual list */}
                  <h3 className="text-xl font-bold text-white mb-4 pr-3 border-r-4 border-indigo-500 inline-block font-sans">
                    دليل تشغيل التطبيقات وتثبيت الاشتراك ⚙️
                  </h3>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 font-sans">
                    {selectedServer.downloads && selectedServer.downloads.map((dl, idx) => {
                      if (dl.type === 'feature_list') {
                        return (
                          <div key={idx} className="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 text-right">
                            <div className="flex items-center gap-3 mb-3 text-amber-500 justify-start">
                              <Icon name="Crown" className="w-5 h-5 text-amber-400" />
                              <h4 className="font-bold text-base md:text-lg">{dl.title}</h4>
                            </div>
                            <div className="space-y-2 text-slate-300 text-sm leading-relaxed whitespace-pre-line">
                              {dl.additionalInfo}
                            </div>
                          </div>
                        );
                      }

                      return (
                        <div key={idx} className="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between text-right">
                          <div className="mb-4">
                            <div className="flex items-center gap-3 mb-2 justify-start">
                              {dl.type === 'android_apk' && <Icon name="Smartphone" className="w-5 h-5 text-emerald-400" />}
                              {dl.type === 'downloader' && <Icon name="Tv" className="w-5 h-5 text-sky-400" />}
                              {dl.type === 'apple_ios' && <Icon name="Apple" className="w-5 h-5 text-rose-400" />}
                              {dl.type === 'tv_smart' && <Icon name="Tv" className="w-5 h-5 text-indigo-400" />}
                              {dl.type === 'web_pc' && <Icon name="Laptop" className="w-5 h-5 text-purple-400" />}
                              <h4 className="font-bold text-slate-100 text-base">{dl.title}</h4>
                            </div>
                            <p className="text-xs text-slate-500 leading-relaxed mb-4">{dl.subtitle}</p>

                            {dl.value && (
                              <div className="bg-slate-950/60 p-4 rounded-xl border border-dashed border-indigo-500/30 flex items-center justify-between mb-4">
                                <div className="font-mono text-xl font-black text-indigo-400 tracking-wider">
                                  {dl.value}
                                </div>
                                <button 
                                  onClick={() => copyToClipboard(dl.value)}
                                  className="px-3 py-1.5 rounded-lg bg-slate-900 text-xs text-slate-300 hover:text-white border border-slate-800 cursor-pointer"
                                >
                                  {copiedValue === dl.value ? "تم نسخ الكود!" : "نسخ الكود"}
                                </button>
                              </div>
                            )}

                            {dl.additionalInfo && (
                              <p className="text-xs text-slate-300 bg-slate-950/35 p-3 rounded-lg border border-slate-800 whitespace-pre-line leading-relaxed">
                                {dl.additionalInfo}
                              </p>
                            )}
                          </div>

                          {dl.link && (
                            <a 
                              href={dl.link} 
                              target="_blank" 
                              rel="noopener noreferrer" 
                              className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-center text-xs flex items-center justify-center gap-2 border border-slate-700 transition-all cursor-pointer"
                            >
                              <span>الرابط المباشر للبرنامج</span>
                              <Icon name="ExternalLink" className="w-3.5 h-3.5" />
                            </a>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Prices grid */}
                  <h3 className="text-xl font-bold text-white mb-4 pr-3 border-r-4 border-indigo-500 inline-block font-sans">
                    باقات واشتراكات ورخصة سيرفر {selectedServer.name} 💳
                  </h3>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8 font-sans">
                    {selectedServer.prices && selectedServer.prices.map((pr, idx) => (
                      <div 
                        key={idx} 
                        className={"bg-slate-900 border " + (pr.isPopular ? 'border-teal-500 scale-102 hover:border-teal-400 shadow-lg shadow-teal-500/5' : 'border-slate-800') + " rounded-2xl p-6 text-center relative flex flex-col justify-between"}
                      >
                        {pr.isPopular && (
                          <div className="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-1 bg-teal-500 text-slate-950 text-[10px] font-extrabold rounded-full flex items-center gap-1">
                            <Icon name="Sparkles" className="w-3 h-3" />
                            <span>الباقة الموصى بها</span>
                          </div>
                        )}

                        <div className="mb-4">
                          <h4 className="text-xs font-bold text-slate-400 mb-2">{pr.duration}</h4>
                          <span className={"text-2xl font-black " + (pr.isPopular ? 'text-teal-400' : 'text-slate-100')}>
                            {pr.price}
                          </span>
                        </div>

                        <button 
                          onClick={() => {
                            setSelectedServer(null);
                            setBookingDetails({ isOpen: true, serverName: selectedServer.name, duration: pr.duration, price: pr.price });
                          }}
                          className={"w-full py-2.5 rounded-xl text-xs font-black transition-all cursor-pointer " + (pr.isPopular ? 'bg-teal-500 text-slate-950' : 'bg-indigo-600 text-white hover:bg-indigo-500')}
                        >
                          شراء وحجز فوري 🛒
                        </button>
                      </div>
                    ))}
                  </div>

                  {/* Notice Alert */}
                  {selectedServer.noticeTitle && (
                    <div className={"bg-slate-900 border " + activeColors.border + " rounded-2xl p-6 md:p-8 flex items-start gap-4 text-right"}>
                      <div className="p-3 bg-indigo-500/10 rounded-xl text-indigo-400 shrink-0">
                        <Icon name="AlertCircle" className="w-6 h-6 animate-pulse" />
                      </div>
                      <div>
                        <h4 className="font-bold text-white text-base md:text-lg">{selectedServer.noticeTitle}</h4>
                        <p className="text-slate-300 text-sm leading-relaxed mt-1 font-sans">{selectedServer.noticeDesc}</p>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

            {/* General Booking Modal */}
            {bookingDetails.isOpen && (
              <div 
                className="fixed inset-0 bg-slate-955/85 z-[3000] backdrop-blur-md flex items-center justify-center p-4 animate-fade-in"
                onClick={() => setBookingDetails({ isOpen: false, serverName: '', duration: '', price: '' })}
              >
                <div 
                  className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl relative text-right"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="h-1.5 bg-gradient-to-r from-blue-600 to-teal-500" />
                  
                  <button 
                    onClick={() => setBookingDetails({ isOpen: false, serverName: '', duration: '', price: '' })}
                    className="absolute left-4 top-5 p-1 rounded-full bg-slate-800 text-slate-400 hover:text-white"
                  >
                    <Icon name="X" className="w-5 h-5" />
                  </button>

                  <div className="p-6 md:p-8">
                    <h3 className="text-2xl font-black text-slate-100 mb-2">تفاصيل حجز الفاتورة والتشغيل</h3>
                    <p className="text-slate-400 text-xs md:text-sm mb-6 bg-slate-950/60 p-4 rounded-xl border border-slate-800 font-sans">
                      أنت بصدد طلب تفعيل باقة <span className="text-teal-400 font-bold">{bookingDetails.serverName}</span> لمدّة (<span className="text-indigo-400 font-bold">{bookingDetails.duration}</span>) بقيمة <span className="text-amber-400 font-black">{bookingDetails.price}</span>.
                    </p>

                    {bookingDone ? (
                      <div className="py-12 text-center flex flex-col items-center justify-center">
                        <div className="w-16 h-16 bg-emerald-500/10 border border-emerald-500 text-emerald-400 rounded-full flex items-center justify-center mb-4 animate-bounce">
                          <Icon name="Check" className="w-8 h-8" />
                        </div>
                        <h4 className="text-xl font-bold text-slate-100 mb-2">تم تجهيز طلبك بنجاح!</h4>
                        <p className="text-slate-400 text-sm">برجاء الانتظار، جاري تحويلك لواتساب المبيعات الآن للتفعيل الفوري...</p>
                      </div>
                    ) : (
                      <form onSubmit={submitBooking} className="space-y-4 text-xs font-sans">
                        <div>
                          <label className="block text-slate-400 font-bold mb-1.5">الاسم كاملاً:</label>
                          <input 
                            type="text" 
                            required
                            placeholder="علي البصري"
                            value={bookingForm.name}
                            onChange={(e) => setBookingForm({ ...bookingForm, name: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-indigo-500 outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-slate-400 font-bold mb-1.5">رقم الواتساب الخاص بك:</label>
                          <input 
                            type="tel" 
                            required
                            placeholder="07700000000"
                            value={bookingForm.phone}
                            onChange={(e) => setBookingForm({ ...bookingForm, phone: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-indigo-500 outline-none font-mono"
                          />
                        </div>

                        <div>
                          <label className="block text-slate-400 font-bold mb-1.5">ملاحظات إضافية للجهاز (الشاشة أو الهاتف):</label>
                          <textarea 
                            rows="2"
                            placeholder="مثال: يرجى تفعيل الكود على شاشة LG"
                            value={bookingForm.notes}
                            onChange={(e) => setBookingForm({ ...bookingForm, notes: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 resize-none focus:border-indigo-500 outline-none"
                          />
                        </div>

                        <button 
                          type="submit"
                          className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold rounded-xl py-3.5 transition-all text-xs"
                        >
                          إتمام الحجز وفتح الواتساب 🚀
                        </button>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
